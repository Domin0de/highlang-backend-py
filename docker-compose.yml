version: "3"
services:
    db:
        container_name: highlang_db
        image: mysql:5.7
        ports:
          - "32001:3306"
        environment:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: highlang
    app:
        container_name: highlang_app
        links:
          - "db"
        build: ./
        ports:
          - "5001:5000"
        environment:
            DB_USER: root
            DB_PASS: password
            DB_PORT: 32001
            DB_NAME: highlang